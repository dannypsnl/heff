# The documentation's site, a version of it for main and for each
# release, published as the repository's GitHub Pages at each push to
# main that changes it, and run by the release workflow, on main, at
# each release tag (only main may publish the pages).  Each version is
# built from its own checkout, as that checkout builds it: heff built by
# zig, the library's API pages made by it (`make api`, where the version has
# it), and `npm run build` in docs/, at the version's own base.  The
# versions are main, at dev/, and each release, at X.Y.Z/ (but v0.4.0,
# from before the site); the newest release is also the root (main is,
# while there is none).  Their list, versions.json at the root, is what
# each version's picker reads, so an old version knows of newer ones.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - editors/vscode/syntaxes/**
      - lib/**
      - src/**
      - app/heff/**
      - boot/**
      - scripts/doc-versions.mjs
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      list: ${{ steps.versions.outputs.list }}
      releases: ${{ steps.versions.outputs.releases }}
      cached: ${{ steps.releases.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # (the releases' pages, all of them together, are kept as they
      # were last published while the tags stay the same: then only main
      # is built.  The leading v1 is bumped when the way a version is
      # built here changes)
      - id: versions
        run: |
          git ls-remote --tags origin 'v*' > tags
          echo "list=$(node scripts/doc-versions.mjs json < tags)" >> "$GITHUB_OUTPUT"
          if [ -n "$(node scripts/doc-versions.mjs < tags)" ]; then
            echo "releases=heff-docs-releases-v1-$(sha256sum tags | cut -c 1-16)" >> "$GITHUB_OUTPUT"
          fi
          node scripts/doc-versions.mjs < tags
      - id: releases
        if: steps.versions.outputs.releases
        uses: actions/cache/restore@v6
        with:
          path: releases
          key: ${{ steps.versions.outputs.releases }}
          lookup-only: true
      - id: matrix
        run: |
          node scripts/doc-versions.mjs matrix < tags > matrix.json
          if [ "${{ steps.releases.outputs.cache-hit }}" = true ]; then
            jq -c 'map(select(.ref == "main"))' matrix.json > main.json
            mv main.json matrix.json
          fi
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    name: build ${{ matrix.version }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      # (the zig the version's own CI builds it with)
      - id: ref
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dirs=$(echo '${{ matrix.dirs }}' | tr ' ' '+')" >> "$GITHUB_OUTPUT"
          echo "zig=$(sed -n 's/^ *version: \([0-9][0-9.]*\)$/\1/p' .github/workflows/ci.yml | head -n 1)" >> "$GITHUB_OUTPUT"
      # (a release's pages, built before at the same commit for the same
      # places, are not built again, when a new release is: the leading
      # v1 is bumped with the one above)
      - id: site
        if: matrix.ref != 'main'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/site
          key: heff-docs-site-v1-${{ matrix.version }}-${{ steps.ref.outputs.sha }}-${{ steps.ref.outputs.dirs }}
      - if: steps.site.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.ref.outputs.zig || '0.17.0' }}
      # (heff built for this version before, with its caches; for main,
      # else the heff CI built last: built again only as far as the
      # source changed.  A release never starts from another's, which
      # might not build its source)
      - if: steps.site.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            .heff
          key: heff-docs-${{ runner.os }}-${{ matrix.ref }}-${{ steps.ref.outputs.sha }}
          restore-keys: |
            heff-docs-${{ runner.os }}-${{ matrix.ref }}-
            ${{ matrix.ref == 'main' && format('heff-{0}-', runner.os) || format('heff-docs-{0}-{1}-', runner.os, matrix.ref) }}
      - if: steps.site.outputs.cache-hit != 'true'
        run: |
          if make -n api > /dev/null 2>&1; then make build api
          else echo "no API pages in ${{ matrix.ref }}"; fi
      - if: steps.site.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - if: steps.site.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: docs
      # (once for each of its places, `.` the root)
      - if: steps.site.outputs.cache-hit != 'true'
        run: |
          for dir in ${{ matrix.dirs }}; do
            if [ "$dir" = . ]; then base=/heff; else base=/heff/$dir; fi
            rm -rf dist
            DOCS_ROOT=/heff DOCS_BASE=$base DOCS_VERSION=${{ matrix.version }} npm run build
            mkdir -p "$RUNNER_TEMP/site/$dir"
            cp -R dist/. "$RUNNER_TEMP/site/$dir/"
          done
        working-directory: docs
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.version }}
          path: ${{ runner.temp }}/site
          retention-days: 1

  pages:
    needs: [versions, build]
    runs-on: ubuntu-latest
    steps:
      - if: needs.versions.outputs.cached == 'true'
        uses: actions/cache/restore@v6
        with:
          path: releases
          key: ${{ needs.versions.outputs.releases }}
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          merge-multiple: true
          path: site
      - if: needs.versions.outputs.releases && needs.versions.outputs.cached != 'true'
        run: |
          mkdir -p releases
          cp -R site/. releases/
          rm -rf releases/dev
      - if: needs.versions.outputs.releases && needs.versions.outputs.cached != 'true'
        uses: actions/cache/save@v6
        with:
          path: releases
          key: ${{ needs.versions.outputs.releases }}
      - if: needs.versions.outputs.cached == 'true'
        run: cp -R releases/. site/
      - env:
          LIST: ${{ needs.versions.outputs.list }}
        run: printf '%s\n' "$LIST" > site/versions.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
